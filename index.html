<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e9eff0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Odat Yo'li">
<title>Odat Yo'li</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, scrollable section tabs, content, floating add button. */
:root{
  --h:178;
  --bg:#e9eff0; --surface:#f7fafa; --surface2:#dde7e8; --fg:#10272b; --muted:#566b6f; --line:#c5d4d6;
  --accent:hsl(var(--h) 62% 30%); --accent-fg:#ffffff; --accent-soft:hsl(var(--h) 40% 86%);
  --good:#1f7a4d; --warn:#a86a00; --bad:#b3372f;
  --p-high:#b3372f; --p-mid:#a86a00; --p-low:#4d7a86;
  --display:'Unbounded','Trebuchet MS',sans-serif; --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1819; --surface:#162325; --surface2:#1d2f32; --fg:#e3eeef; --muted:#8aa2a6; --line:#2a4044;
  --accent:hsl(var(--h) 58% 62%); --accent-fg:#06191b; --accent-soft:hsl(var(--h) 30% 20%);
  --good:#58c78d; --warn:#e0a63b; --bad:#ee7b72; --p-high:#ee7b72; --p-mid:#e0a63b; --p-low:#7fb3c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1819; --surface:#162325; --surface2:#1d2f32; --fg:#e3eeef; --muted:#8aa2a6; --line:#2a4044;
  --accent:hsl(var(--h) 58% 62%); --accent-fg:#06191b; --accent-soft:hsl(var(--h) 30% 20%);
  --good:#58c78d; --warn:#e0a63b; --bad:#ee7b72; --p-high:#ee7b72; --p-mid:#e0a63b; --p-low:#7fb3c0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 4px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand h1 small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:2px}
.icons{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 6px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
main{padding-top:8px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{justify-content:space-between}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:25}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
/* habit grid */
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk b{font-size:14px}
.hgrid{overflow-x:auto}
.hr{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,38px);align-items:center;gap:4px;padding-block:6px;border-top:1px solid var(--line);min-width:420px}
.hr.hd{border-top:0;font-size:12px;color:var(--muted);text-align:center}
.hr.hd .today{color:var(--accent);font-weight:700}
.hn{display:flex;gap:8px;align-items:center;min-width:0;text-align:left;background:none;border:0;padding:0}
.hn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.cell{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:16px;padding:0}
.cell[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cell.td{border-color:var(--accent)}
.streak{font-size:12px;color:var(--muted)}
/* lists */
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:15px;padding:0;margin-top:1px}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* pomodoro */
.clock{font-family:var(--display);font-size:46px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.seg{display:flex;gap:8px}
.seg .btn{flex:1}
.map{position:relative;height:30px;border-radius:8px;background:var(--surface2);overflow:hidden}
.map i{position:absolute;top:0;bottom:0}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* inputs */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--fg)}
textarea.in{min-height:140px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(5,15,17,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.sheet h3{font-family:var(--display);font-size:16px;margin:0}
.swatches{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.tasbih{width:150px;height:150px;border-radius:50%;border:0;margin:6px auto;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:42px;font-weight:600;display:grid;place-items:center;box-shadow:inset 0 0 0 8px rgba(255,255,255,.14)}
.big{font-family:var(--display);font-size:24px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.cell,.chk,.tasbih{transition:transform .08s}.cell:active,.chk:active,.tasbih:active{transform:scale(.92)}}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <h1>Odat Yo'li<small id="sub"></small></h1>
    <div class="icons">
      <button class="ib" id="btnColor" aria-label="Rang">◐</button>
      <button class="ib" id="btnTheme" aria-label="Mavzu">☾</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Qo'shish">+</button>
<div id="layer"></div>

<script>
(function(){
var KEY='odat_yoli_v1';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var TODAY=function(){return ymd(new Date())};
var MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
var DOW=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
var DOWL=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
function fmtDate(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()]}
function fmtLong(s){var d=parse(s);return DOWL[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}

var D={habits:[],tasks:[],goals:[],notes:[],journal:{},dhikr:[],prayers:{},qaza:null,study:[],
  pomo:{cfg:{work:25,short:5,long:15,every:4,wake:'06:00',sleep:'23:00',auto:false,vib:true,sound:true},log:{},run:null,cycle:0},
  ui:{tab:'odat',theme:'',hue:178,weekOff:0,taskDay:TODAY()}};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in o){if(k==='pomo'){D.pomo.cfg=Object.assign(D.pomo.cfg,o.pomo.cfg||{});D.pomo.log=o.pomo.log||{};D.pomo.run=o.pomo.run||null;D.pomo.cycle=o.pomo.cycle||0}else if(k==='ui'){D.ui=Object.assign(D.ui,o.ui)}else D[k]=o[k]}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
load();D.ui.taskDay=TODAY();D.ui.weekOff=0;

var TABS=[['odat','Odatlar'],['vazifa','Vazifalar'],['maqsad','Maqsadlar'],['pomo','Pomodoro'],['stress','Kundalik'],['konspekt','Konspekt'],['islom','Musulmonlar'],['tib','Tibbiyot']];
var PR={h:['Muhim','var(--p-high)',0],m:['O\'rtacha','var(--p-mid)',1],l:['Muhim emas','var(--p-low)',2]};

function applyTheme(){
  var r=document.documentElement;
  if(D.ui.theme)r.setAttribute('data-theme',D.ui.theme);else r.removeAttribute('data-theme');
  r.style.setProperty('--h',D.ui.hue);
  var dark=D.ui.theme==='dark'||(!D.ui.theme&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  $('#btnTheme').textContent=dark?'☀':'☾';
}

/* sheet */
function sheet(title,html,onSave,saveLabel){
  var v=document.createElement('div');v.className='veil';
  v.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3><div id="sb" style="display:flex;flex-direction:column;gap:12px">'+html+'</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Yopish</button>'+(onSave?'<button class="btn pri" data-ok>'+(saveLabel||'Saqlash')+'</button>':'')+'</div></div>';
  $('#layer').appendChild(v);
  function close(){v.remove()}
  v.addEventListener('click',function(e){if(e.target===v||e.target.hasAttribute('data-x'))close()});
  var ok=$('[data-ok]',v);
  if(ok)ok.addEventListener('click',function(){if(onSave($('#sb',v))!==false)close()});
  var f=$('input,textarea',v);if(f&&f.type!=='date')setTimeout(function(){f.focus()},50);
  return {el:v,close:close};
}
function chipsPick(root,name,def){
  var cur=def;
  root.querySelectorAll('[data-chip="'+name+'"] .chip').forEach(function(b){
    b.setAttribute('aria-pressed',b.dataset.v===cur?'true':'false');
    b.addEventListener('click',function(){cur=b.dataset.v;root.querySelectorAll('[data-chip="'+name+'"] .chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.v===cur?'true':'false')});root.dataset['c_'+name]=cur});
  });
  root.dataset['c_'+name]=cur;
}
function prioChips(){return '<div class="chips" data-chip="prio"><button class="chip" data-v="h">Muhim</button><button class="chip" data-v="m">O\'rtacha</button><button class="chip" data-v="l">Muhim emas</button></div>'}
function sortPrio(a,b){return PR[a.prio||'m'][2]-PR[b.prio||'m'][2]}

/* ===== ODATLAR ===== */
function weekDays(){var base=addDays(new Date(),D.ui.weekOff*7);var dow=(base.getDay()+6)%7;var mon=addDays(base,-dow);var a=[];for(var i=0;i<7;i++)a.push(ymd(addDays(mon,i)));return a}
function streak(h){var n=0,d=new Date();if(!h.done[ymd(d)])d=addDays(d,-1);while(h.done[ymd(d)]){n++;d=addDays(d,-1)}return n}
function vOdat(){
  var days=weekDays(),t=TODAY();
  var hs=D.habits.filter(function(h){return !h.due||h.due>=t||streak(h)>0||true}).slice().sort(sortPrio);
  var head='<div class="hr hd"><span></span>'+days.map(function(s){var d=parse(s);return '<span class="'+(s===t?'today':'')+'">'+DOW[d.getDay()]+'<br>'+d.getDate()+'</span>'}).join('')+'</div>';
  var rows=hs.map(function(h){
    return '<div class="hr"><button class="hn" data-edit="'+h.id+'"><i class="dot" style="background:'+PR[h.prio||'m'][1]+'"></i><span>'+esc(h.name)+'</span></button>'+
      days.map(function(s){return '<button class="cell'+(s===t?' td':'')+'" data-h="'+h.id+'" data-d="'+s+'" aria-pressed="'+(h.done[s]?'true':'false')+'" aria-label="'+esc(h.name)+' '+s+'">'+(h.done[s]?'✓':'')+'</button>'}).join('')+'</div>';
  }).join('');
  var first=parse(days[0]),last=parse(days[6]);
  var done=0,tot=0;hs.forEach(function(h){days.forEach(function(s){if(s<=t){tot++;if(h.done[s])done++}})});
  var pct=tot?Math.round(done*100/tot):0;
  return '<div class="card"><div class="wk"><button class="btn sm" data-wk="-1">‹</button><b>'+first.getDate()+' '+MON[first.getMonth()]+' – '+last.getDate()+' '+MON[last.getMonth()]+'</b><button class="btn sm" data-wk="1">›</button></div>'+
    (D.ui.weekOff!==0?'<div class="row" style="justify-content:center;margin-top:8px"><button class="btn sm" data-wk="0">Bugun</button></div>':'')+
    '<div class="row sp" style="margin-top:12px"><span class="muted">Shu haftada bajarilgan</span><b>'+pct+'%</b></div><div class="bar" style="margin-top:6px"><i style="width:'+pct+'%"></i></div></div>'+
    (hs.length?'<div class="card hgrid">'+head+rows+'</div><div class="muted" style="text-align:center">Kataklarni bosib belgilang. Odat nomini bosib tahrirlang.</div>':'<div class="card empty">Hali odat yo\'q.<br>Pastdagi + tugmani bosing.</div>');
}
function bOdat(){
  var v=$('#view');
  v.querySelectorAll('[data-wk]').forEach(function(b){b.onclick=function(){var n=+b.dataset.wk;D.ui.weekOff=n===0?0:D.ui.weekOff+n;save();render()}});
  v.querySelectorAll('.cell').forEach(function(b){b.onclick=function(){var h=D.habits.find(function(x){return x.id===b.dataset.h});if(h.done[b.dataset.d])delete h.done[b.dataset.d];else h.done[b.dataset.d]=1;save();render()}});
  v.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){editHabit(D.habits.find(function(x){return x.id===b.dataset.edit}))}});
}
function editHabit(h){
  var s=sheet(h?'Odatni tahrirlash':'Yangi odat',
    '<label class="f">Nomi<input class="in" id="f1" value="'+esc(h?h.name:'')+'" placeholder="Masalan: 20 daqiqa kitob o\'qish"></label>'+
    '<label class="f">Reja (daqiqa)<input class="in" id="f2" type="number" min="0" inputmode="numeric" value="'+(h&&h.plan||'')+'"></label>'+
    '<label class="f">Muddat (ixtiyoriy)<input class="in" id="f3" type="date" value="'+(h&&h.due||'')+'"></label>'+
    '<div class="muted">Ustuvorlik</div>'+prioChips()+
    (h?'<button class="btn bad" id="fdel">Odatni o\'chirish</button>':''),
    function(r){var n=$('#f1',r).value.trim();if(!n){$('#f1',r).focus();return false}
      var o=h||{id:uid(),done:{}};o.name=n;o.plan=+$('#f2',r).value||0;o.due=$('#f3',r).value;o.prio=r.dataset.c_prio;
      if(!h)D.habits.push(o);save();render()});
  chipsPick($('#sb',s.el),'prio',h&&h.prio||'m');
  var d=$('#fdel',s.el);if(d)d.onclick=function(){if(d.dataset.sure){D.habits=D.habits.filter(function(x){return x!==h});save();s.close();render()}else{d.dataset.sure=1;d.textContent='Ishonchingiz komilmi? Yana bosing'}};
}

/* ===== VAZIFALAR ===== */
function vVazifa(){
  var day=D.ui.taskDay,t=TODAY();
  var list=D.tasks.filter(function(x){return x.date===day}).sort(function(a,b){return (a.done-b.done)||sortPrio(a,b)});
  var over=day===t?D.tasks.filter(function(x){return x.date<t&&!x.done}):[];
  var strip='';for(var i=-3;i<=10;i++){var s=ymd(addDays(new Date(),i)),d=parse(s);strip+='<button class="chip" data-day="'+s+'" aria-pressed="'+(s===day?'true':'false')+'" style="flex:none;text-align:center;min-width:48px">'+DOW[d.getDay()]+'<br><b>'+d.getDate()+'</b></button>'}
  function item(x){return '<div class="card item'+(x.done?' done':'')+'"><button class="chk" data-tk="'+x.id+'" aria-pressed="'+(x.done?'true':'false')+'" aria-label="Bajarildi">'+(x.done?'✓':'')+'</button><div class="body"><div class="t">'+esc(x.name)+'</div><div class="muted"><i class="dot" style="display:inline-block;background:'+PR[x.prio||'m'][1]+';margin-right:6px"></i>'+PR[x.prio||'m'][0]+(x.date<t&&!x.done?' · '+fmtDate(x.date)+' dan':'')+'</div></div><button class="x" data-td="'+x.id+'" aria-label="O\'chirish">✕</button></div>'}
  return '<div class="card"><div class="muted">'+fmtLong(day)+'</div><div style="display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px" id="strip">'+strip+'</div></div>'+
    (over.length?'<h2>Bajarilmagan (oldingi kunlar)</h2>'+over.map(item).join(''):'')+
    (list.length?list.map(item).join(''):'<div class="card empty">Bu kun uchun vazifa yo\'q.<br>Pastdagi + tugmani bosing.</div>');
}
function bVazifa(){
  var v=$('#view');
  v.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){D.ui.taskDay=b.dataset.day;render()}});
  v.querySelectorAll('[data-tk]').forEach(function(b){b.onclick=function(){var x=D.tasks.find(function(y){return y.id===b.dataset.tk});x.done=!x.done;save();render()}});
  v.querySelectorAll('[data-td]').forEach(function(b){b.onclick=function(){D.tasks=D.tasks.filter(function(y){return y.id!==b.dataset.td});save();render()}});
  var st=$('#strip');if(st){var a=st.querySelector('[aria-pressed="true"]');if(a)st.scrollLeft=a.offsetLeft-st.clientWidth/2}
}
function addTask(){

var TYPES={work:['Ish','var(--accent)'],short:['Tanaffus','var(--good)'],long:['Uzun tanaffus','var(--warn)']};
function mins(hhmm){var p=hhmm.split(':');return +p[0]*60+ +p[1]}
function fmtT(ms){var s=Math.max(0,Math.round(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function logToday(){var t=TODAY();return D.pomo.log[t]||(D.pomo.log[t]=[])}
function beep(){var c=D.pomo.cfg;try{if(c.vib&&navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  if(!c.sound)return;try{var A=window.AudioContext||window.webkitAudioContext;var a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function startRun(type,note){
  var c=D.pomo.cfg,m=type==='work'?c.work:type==='short'?c.short:c.long;
  D.pomo.run={type:type,start:Date.now(),dur:m*60000,note:note||''};save();render();
}
function finishRun(natural){
  var r=D.pomo.run;if(!r)return;
  var end=natural?r.start+r.dur:Date.now();
  if(end-r.start>=30000)logToday().push({t:r.type,s:r.start,e:end,n:r.note});
  D.pomo.run=null;
  if(natural){beep();var c=D.pomo.cfg;
    if(r.type==='work'){D.pomo.cycle++;var nx=(D.pomo.cycle%c.every===0)?'long':'short';if(c.auto)startRun(nx,'');}
    else if(c.auto)startRun('work',r.note);
  }
  save();render();
}

  var a=mins(c.wake),b=mins(c.sleep);if(b<=a)b+=1440;var span=b-a;
  var d0=new Date();d0.setHours(0,0,0,0);var base=d0.getTime()+a*60000;
  var segs=L.map(function(x){var l=(x.s-base)/60000/span*100,w=(x.e-x.s)/60000/span*100;l=Math.max(0,l);return '<i style="left:'+l+'%;width:'+Math.max(.6,w)+'%;background:'+TYPES[x.t][1]+'"></i>'}).join('');

    :'<div class="clock" style="color:var(--muted)">'+pad(c.work)+':00</div><label class="f">Nima bilan shug\'ullanasiz?<input class="in" id="pnote" placeholder="Masalan: Farmakologiya"></label><div class="seg"><button class="btn pri" id="pWork">Ish</button><button class="btn" id="pShort">Tanaffus</button></div>';
  var logs=L.slice().reverse().map(function(x){return '<div class="row sp" style="padding-block:6px;border-top:1px solid var(--line)"><span><i class="dot" style="display:inline-block;background:'+TYPES[x.t][1]+';margin-right:8px"></i>'+TYPES[x.t][0]+(x.n?' · '+esc(x.n):'')+'</span><span class="muted">'+new Date(x.s).toTimeString().slice(0,5)+' · '+Math.round((x.e-x.s)/60000)+' daq</span></div>'}).join('');

    '<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row sp"><h2>Bugungi kun xaritasi</h2><span class="muted">'+Math.round(wk)+' daq ish · '+Math.round(br)+' daq dam</span></div><div class="map">'+segs+'<i style="left:'+nowp+'%;width:2px;background:var(--fg)"></i></div><div class="row sp muted"><span>'+c.wake+'</span><span>'+c.sleep+'</span></div><div class="leg"><span><b style="background:var(--accent)"></b>Ish</span><span><b style="background:var(--good)"></b>Dam</span><span><b style="background:var(--warn)"></b>Uzun dam</span></div>'+(L.length?logs:'<div class="muted" style="text-align:center">Hali yozuv yo\'q. Yuqoridagi tugmani bosib boshlang.</div>')+'</div>'+

    '<div class="muted">Kuniga nechta qazo kuni o\'qiy olasiz? (1 kun = 6 namoz)</div><div class="chips" data-chip="p"><button class="chip" data-v="1">1</button><button class="chip" data-v="2">2</button><button class="chip" data-v="3">3</button></div>'+
    '<div class="muted">Balog\'at sanasi kiritilmasa, tug\'ilgan sanadan ayol uchun 9, erkak uchun 12 yosh hisoblanadi. Natija taxminiy.</div>',
    function(r){
      var g=r.dataset.c_g,bal=$('#q1',r).value,bi=$('#q2',r).value,be=$('#q3',r).value;
      if(!be)return false;
      if(!bal){if(!bi)return false;var b=parse(bi);b.setFullYear(b.getFullYear()+(g==='f'?9:12));bal=ymd(b)}
      var days=Math.max(0,Math.round((parse(be)-parse(bal))/864e5));
      D.qaza={g:g,bal:$('#q1',r).value,birth:bi,begin:be,total:days*6,paid:q.paid||0,perDay:(+r.dataset.c_p||1)*6};save();render()});
  var r=$('#sb',s.el);chipsPick(r,'g',q.g||'f');chipsPick(r,'p',q.perDay?String(q.perDay/6):'1');
}

/* ===== TIBBIYOT ===== */
function vTib(){
  var tot=D.study.reduce(function(a,s){return a+s.min},0);
  return '<div class="card"><div class="row sp"><h2>O\'quv bo\'limlari</h2><span class="muted">Jami '+(tot/60).toFixed(1)+' soat</span></div><div class="muted" style="margin-top:4px">Har bir fan yoki mavzu uchun vaqtni qo\'shib boring.</div></div>'+
   (D.study.length?D.study.map(function(s){var pc=s.target?Math.min(100,Math.round(s.min/60*100/s.target)):0;return '<div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="row sp"><b>'+esc(s.name)+'</b><button class="x" data-sd="'+s.id+'">✕</button></div><div class="row sp"><span class="big">'+(s.min/60).toFixed(1)+' <span class="muted" style="font-size:13px;font-family:var(--body)">soat'+(s.target?' / '+s.target:'')+'</span></span></div>'+(s.target?'<div class="bar"><i style="width:'+pc+'%"></i></div>':'')+'<div class="chips"><button class="chip" data-sm="'+s.id+'" data-m="30">+30 daq</button><button class="chip" data-sm="'+s.id+'" data-m="60">+1 soat</button><button class="chip" data-sm="'+s.id+'" data-m="-30">−30 daq</button></div></div>'}).join(''):'<div class="card empty">Hali bo\'lim yo\'q.<br>Pastdagi + tugmani bosing.</div>');
}
function bTib(){
  var v=$('#view');
  v.querySelectorAll('[data-sm]').forEach(function(b){b.onclick=function(){var s=D.study.find(function(y){return y.id===b.dataset.sm});s.min=Math.max(0,s.min+ +b.dataset.m);save();render()}});
  v.querySelectorAll('[data-sd]').forEach(function(b){b.onclick=function(){D.study=D.study.filter(function(y){return y.id!==b.dataset.sd});save();render()}});
}
function addStudy(){
  sheet('Yangi bo\'lim','<label class="f">Fan yoki mavzu<input class="in" id="f1" placeholder="Masalan: Farmakologiya"></label><label class="f">Maqsad (soat, ixtiyoriy)<input class="in" id="f2" type="number" inputmode="numeric"></label>',
    function(r){var n=$('#f1',r).value.trim();if(!n)return false;D.study.push({id:uid(),name:n,min:0,target:+$('#f2',r).value||0});save();render()});
}

/* ===== shell ===== */
var VIEWS={odat:[vOdat,bOdat,function(){editHabit(null)}],vazifa:[vVazifa,bVazifa,addTask],maqsad:[vMaqsad,bMaqsad,addGoal],pomo:[vPomo,bPomo,null],stress:[vStress,bStress,null],konspekt:[vKons,bKons,addNote],islom:[vIslom,bIslom,null],tib:[vTib,bTib,addStudy]};
function render(){
  var tab=D.ui.tab,V=VIEWS[tab];
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===tab?'true':'false')+'">'+t[1]+'</button>'}).join('');
  $('#tabs').querySelectorAll('.tab').forEach(function(b){b.onclick=function(){D.ui.tab=b.dataset.t;save();render();window.scrollTo(0,0)}});
  var d=new Date();$('#sub').textContent=DOWL[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];
  var sc=window.scrollY;
  $('#view').innerHTML=V[0]();V[1]();
  $('#fab').hidden=!V[2];
  $('#fab').onclick=V[2]||null;
  window.scrollTo(0,sc);
  var ta=$('#tabs .tab[aria-selected="true"]');if(ta&&ta.scrollIntoView&&!render.once){render.once=1;try{ta.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
}
$('#btnTheme').onclick=function(){var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);D.ui.theme=dark?'light':'dark';save();applyTheme()};
$('#btnColor').onclick=function(){
  var hs=[178,215,265,330,18,140];
  var s=sheet('Rang tanlang','<div class="swatches">'+hs.map(function(h){return '<button class="sw" data-hu="'+h+'" aria-pressed="'+(h===D.ui.hue?'true':'false')+'" style="background:hsl('+h+' 62% 38%)" aria-label="Rang"></button>'}).join('')+'</div>',null);
  s.el.querySelectorAll('[data-hu]').forEach(function(b){b.onclick=function(){D.ui.hue=+b.dataset.hu;save();applyTheme();s.el.querySelectorAll('[data-hu]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')})}});
};
applyTheme();render();
})();
</script>
